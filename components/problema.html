<section id="c-mascara">
  
  <div class="c-mascara__sticky">
    
    <h1 class="mascara-texto" id="mascara-texto">CAOS</h1>

    <div class="mascara-revelacion" id="mascara-revelacion">
      <div class="revelacion-inner">
        <p class="revelacion-parrafo">
          Tienes las ideas y la pasión. Pero tus horas de grabación y las ediciones que nunca terminan se acumulan en un limbo digital que solo tú conoces.
        </p>
        <div class="divisor-tecnico"></div>
        <h3 class="revelacion-climax">
          AL FINAL, NO ES QUE NO ESTÉS CREANDO...<br>
          <span class="climax-brillo">ES QUE NO ESTÁS PUBLICANDO.</span>
        </h3>
      </div>
    </div>

  </div>

</section>

<style>
  /* === 1. CONTENEDOR PRINCIPAL === */
  #c-mascara {
    /* Altura masiva (300vh) para permitir que el usuario haga scroll y active la animación */
    height: 350vh; 
    background-color: #010101; /* Negro absoluto, sin distracciones */
    position: relative;
    z-index: 2;
  }

  /* El bloque que se "pega" a la pantalla mientras haces scroll en los 350vh */
  .c-mascara__sticky {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* Evita que el zoom rompa la pantalla */
  }

  /* === 2. LA PALABRA GIGANTE (MÁSCARA DE VIDEO/GLITCH) === */
  .mascara-texto {
    position: absolute;
    font-family: var(--font-main);
    font-size: 25vw; /* Ocupa todo el ancho */
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 1;
    text-transform: uppercase;
    margin: 0;
    z-index: 10;
    will-change: transform, opacity;

    /* EL TRUCO DE LA MÁSCARA */
    /* Por ahora tiene un glitch CSS, pero puedes poner url('tu-timeline-davinci.gif') */
    background: repeating-linear-gradient(
      -45deg,
      #050505 0%,
      #050505 10%,
      #ef4444 10%,
      #ef4444 11%,
      #111 11%,
      #111 20%
    );
    background-size: 200% 200%;
    animation: timelineGlitch 0.4s infinite linear;
    
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent; /* Hace que el texto sea transparente para ver el fondo */
  }

  @keyframes timelineGlitch {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* === 3. EL MENSAJE REVELADO === */
  .mascara-revelacion {
    position: absolute;
    z-index: 5;
    width: 90%;
    max-width: 900px;
    text-align: center;
    /* Inicia oculto y desplazado hacia abajo. JS lo controlará */
    opacity: 0;
    transform: translateY(50px);
    will-change: transform, opacity;
  }

  .revelacion-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
  }

  .revelacion-parrafo {
    font-family: var(--font-main);
    font-size: clamp(1.4rem, 2.5vw, 2rem);
    font-weight: 300;
    line-height: 1.5;
    color: #94a3b8;
    text-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .divisor-tecnico {
    width: 2px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(245, 158, 11, 0.5), transparent);
  }

  .revelacion-climax {
    font-family: var(--font-main);
    font-size: clamp(1.8rem, 4vw, 3.5rem);
    font-weight: 800;
    line-height: 1.2;
    color: #475569;
    letter-spacing: -0.02em;
  }

  .climax-brillo {
    display: block;
    margin-top: 1rem;
    color: #f8fafc;
    /* Resplandor elegante, sin exagerar */
    text-shadow: 0 0 40px rgba(245, 158, 11, 0.3), 0 0 10px rgba(245, 158, 11, 0.1);
  }

  /* MÓVIL */
  @media (max-width: 768px) {
    .mascara-texto { font-size: 35vw; }
    .revelacion-parrafo { font-size: 1.2rem; }
    .revelacion-climax { font-size: 1.5rem; }
  }
</style>

<script>
  (function () {
    const section = document.getElementById('c-mascara');
    const textoMascara = document.getElementById('mascara-texto');
    const revelacion = document.getElementById('mascara-revelacion');

    if (!section || !textoMascara || !revelacion) return;

    let ticking = false;

    const actualizarAnimacion = () => {
      const rect = section.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      
      // Comprobamos si estamos haciendo scroll DENTRO de los 350vh de esta sección
      if (rect.top <= 0 && rect.bottom >= windowHeight) {
        
        // Calculamos el progreso del scroll de 0 (inicio) a 1 (final)
        const scrollTotal = rect.height - windowHeight;
        const scrollActual = Math.abs(rect.top);
        let progreso = scrollActual / scrollTotal; 

        // 1. Efecto Zoom Extremo a la Palabra
        // La escala arranca en 1 y crece hasta 60 veces su tamaño
        const scaleValue = 1 + (progreso * 80);
        
        // 2. Desvanecimiento de la Máscara
        // A partir del 25% del recorrido, la palabra empieza a volverse transparente
        let opacityTexto = 1;
        if (progreso > 0.25) {
          opacityTexto = 1 - ((progreso - 0.25) * 4); // Se vuelve 0 rápido
        }

        textoMascara.style.transform = `scale(${scaleValue})`;
        textoMascara.style.opacity = Math.max(0, opacityTexto);

        // 3. Aparición Suave del Párrafo Revelado
        // A partir del 40% del recorrido, el texto limpio sube y aparece
        let opacityRevelacion = 0;
        let translateY = 50; // Inicia 50px abajo
        
        if (progreso > 0.40) {
          opacityRevelacion = (progreso - 0.40) * 2.5; 
          translateY = 50 - (Math.min(1, opacityRevelacion) * 50); // Sube a 0px
        }

        revelacion.style.opacity = Math.min(1, Math.max(0, opacityRevelacion));
        revelacion.style.transform = `translateY(${Math.max(0, translateY)}px)`;
      }

      ticking = false;
    };

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(actualizarAnimacion);
        ticking = true;
      }
    }, { passive: true });
    
    // Forzar actualización inicial
    actualizarAnimacion();
  })();
</script>
