<header id="k-header" class="k-header">
  <div class="k-header__container">
    
    <a href="#inicio" class="k-header__logo">
      <img src="/assets/logo-konectando-suenos-final-filled-white.png" alt="Konectando Sueños Logo">
    </a>

    <nav class="k-header__nav-glass">
      <a href="#inicio" class="nav-link">Inicio</a>
      <a href="#portafolio" class="nav-link">Portafolio</a>
    </nav>

    <a href="https://wa.me/573207418361?text=Hola%20Konectando%20Sue%C3%B1os,%20vengo%20de%20la%20p%C3%A1gina%20web%20y%20quiero%20llevar%20mis%20sue%C3%B1os%20al%20l%C3%ADmite%20para%20hacerlos%20realidad." 
       target="_blank" 
       class="k-header__btn-contact">
      Contacto
    </a>

  </div>
</header>

<style>
  /* === 1. CONTENEDOR DEL HEADER === */
  .k-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 999; /* Siempre por encima de todo */
    padding: 1.5rem 0;
    transition: all 0.4s ease;
  }

  .k-header__container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* === 2. LOGO === */
  .k-header__logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    /* Ajusta el ancho según como se vea tu logo exportado */
    width: 160px; 
    transition: transform 0.3s ease;
  }
  
  .k-header__logo img {
    width: 100%;
    height: auto;
    object-fit: contain;
    /* Un ligero resplandor blanco para que destaque en fondos oscuros */
    filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.2));
  }

  .k-header__logo:hover {
    transform: scale(1.05);
  }

  /* === 3. NAVEGACIÓN CENTRAL (El óvalo Frosted Glass) === */
  .k-header__nav-glass {
    display: flex;
    align-items: center;
    gap: 2rem;
    /* Fondo semi-transparente muy sutil */
    background: rgba(255, 255, 255, 0.05);
    /* EL SECRETO DEL CRISTAL DE APPLE */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    /* Borde fino y brillante */
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    padding: 0.6rem 2rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  }

  .nav-link {
    color: #f8fafc; /* Blanco perla */
    text-decoration: none;
    font-family: var(--font-main, 'Inter', sans-serif);
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.5px;
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }

  .nav-link:hover {
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }

  /* === 4. BOTÓN DE CONTACTO (Sólido y Elegante) === */
  .k-header__btn-contact {
    /* Color blanco sólido para contrastar con el cristal central */
    background: #ffffff; 
    color: #000000;
    text-decoration: none;
    font-family: var(--font-main, 'Inter', sans-serif);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.6rem 1.5rem;
    border-radius: 50px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
  }

  .k-header__btn-contact:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 25px rgba(255, 255, 255, 0.4);
    background: #f1f5f9;
  }

  /* === MÓVIL (Responsivo) === */
  @media (max-width: 768px) {
    .k-header__container {
      padding: 0 1rem;
    }
    
    .k-header__logo {
      width: 120px;
    }
    
    /* En móviles muy pequeños, reducimos el padding del cristal para que quepa */
    .k-header__nav-glass {
      padding: 0.5rem 1rem;
      gap: 1rem;
    }
    
    .nav-link, .k-header__btn-contact {
      font-size: 0.85rem;
    }
    
    .k-header__btn-contact {
      padding: 0.5rem 1rem;
    }
  }
</style>

<script>
  // Script opcional para que el header se vuelva un poco más opaco al hacer scroll
  window.addEventListener('scroll', () => {
    const header = document.getElementById('k-header');
    if (window.scrollY > 50) {
      header.style.background = 'rgba(0, 0, 0, 0.2)'; // Oscurece levemente
      header.style.backdropFilter = 'blur(10px)';
      header.style.webkitBackdropFilter = 'blur(10px)';
    } else {
      header.style.background = 'transparent';
      header.style.backdropFilter = 'none';
      header.style.webkitBackdropFilter = 'none';
    }
  });
</script>
