<header id="c-header">
  <div class="c-header__inner">
    
    <div class="c-header__left">
      <a href="#" class="c-header__logo">
        Konectando<span>Sueños</span>
      </a>
      
      <nav class="c-header__nav" id="c-header-nav">
        <a href="#inicio" class="c-header__link">Inicio</a>
        <a href="#portafolio" class="c-header__link">Portafolio</a>
      </nav>
    </div>

    <div class="c-header__right">
      <a href="https://wa.me/573207418361?text=Hola%20Konectando%20Sue%C3%B1os,%20quiero%20conectar%20mi%20sue%C3%B1o%20y%20empezar%20a%20publicar%20contenido." target="_blank" class="c-header__cta">
        Conecta tu sueño
      </a>

      <button class="c-header__toggle" id="c-header-toggle" aria-label="Menú">
        <span></span><span></span>
      </button>
    </div>

  </div>
</header>

<style>
  /* === SCOPING CSS: Solo afecta a #c-header === */
  #c-header {
    width: 100%;
    height: var(--header-height);
    background-color: rgba(5, 7, 10, 0.85); /* Negro abismal semitransparente */
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
  }

  #c-header .c-header__inner {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* --- Lado Izquierdo --- */
  #c-header .c-header__left {
    display: flex;
    align-items: center;
    gap: 3rem; /* Espacio entre el logo y los links */
  }

  #c-header .c-header__logo {
    font-family: var(--font-main);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  #c-header .c-header__logo span {
    font-family: var(--font-mono);
    font-weight: 400;
    font-size: 1rem;
    color: var(--text-secondary);
  }

  #c-header .c-header__nav {
    display: flex;
    gap: 2rem;
  }

  #c-header .c-header__link {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    transition: color 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #c-header .c-header__link:hover {
    color: var(--text-primary);
  }

  /* --- Lado Derecho (CTA) --- */
  #c-header .c-header__cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.6rem 1.5rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--bg-main);
    background-color: var(--accent-gold);
    border-radius: 4px;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(245, 158, 11, 0.15); /* Glow sutil celestial */
  }

  #c-header .c-header__cta:hover {
    background-color: var(--accent-gold-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
  }

  /* --- Menú Móvil --- */
  #c-header .c-header__toggle {
    display: none;
    flex-direction: column;
    gap: 6px;
    width: 24px;
  }

  #c-header .c-header__toggle span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: var(--text-primary);
    transition: 0.3s ease;
  }

  /* Responsive */
  @media (max-width: 768px) {
    #c-header .c-header__inner { padding: 0 1.25rem; }
    
    #c-header .c-header__nav {
      position: absolute;
      top: var(--header-height);
      left: 0;
      width: 100%;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-direction: column;
      padding: 1.5rem;
      gap: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    #c-header .c-header__nav.is-active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #c-header .c-header__toggle { display: flex; }
    
    /* El CTA se oculta en móvil para simplificar, o se puede mover al menú nav */
    #c-header .c-header__cta { display: none; } 
  }
</style>

<script>
  /* === AISLAMIENTO JS (IIFE) === */
  (function () {
    const toggle = document.getElementById("c-header-toggle");
    const nav = document.getElementById("c-header-nav");

    if (toggle && nav) {
      toggle.addEventListener("click", () => {
        nav.classList.toggle("is-active");
      });
    }
  })();
</script>
